<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Skill Assessment | TalentTrack AI</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f8f9ff);
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, #4f46e5, #312e81);
            color: white;
            padding: 25px 35px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .brand {
            font-size: 24px;
            font-weight: 700;
        }

        .brand i {
            margin-right: 8px;
        }

        .assessment-container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .assessment-card {
            background: white;
            border-radius: 22px;
            padding: 35px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .title {
            color: #312e81;
            font-weight: 700;
        }

        .subtitle {
            color: #777;
        }

        .category {
            background: #eef2ff;
            color: #4f46e5;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            display: inline-block;
        }

        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 22px;
            margin-top: 25px;
        }

        .question {
            font-weight: 600;
            font-size: 17px;
            margin-bottom: 18px;
        }

        .option {
            border: 1px solid #ddd;
            padding: 12px 15px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .option:hover {
            background: #eef2ff;
            border-color: #4f46e5;
        }

        .option input {
            margin-right: 10px;
        }

        .submit-btn {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 13px 30px;
            font-weight: 600;
            font-size: 16px;
            margin-top: 30px;
        }

        .submit-btn:hover {
            color: white;
            transform: translateY(-2px);
        }

    </style>
</head>

<body>

    <!-- HEADER -->

    <div class="header">

        <div class="brand">
            <i class="bi bi-stars"></i>
            TalentTrack AI
        </div>

    </div>


    <!-- ASSESSMENT -->

    <div class="assessment-container">

        <div class="assessment-card">

            <div class="text-center mb-4">

                <span class="category">
                    <i class="bi bi-lightbulb"></i>
                    Skill Assessment
                </span>

                <h2 class="title mt-3">
                    Discover Your Skills
                </h2>

                <p class="subtitle">
                    Answer the questions honestly to help our AI
                    understand your strengths and career potential.
                </p>

            </div>

<form action="/submit-assessment" method="POST">

    {% for q in questions %}

    <div class="question-card">

        <div class="question">
            {{ loop.index }}. {{ q.question }}
        </div>

        <label class="option d-block">
            <input type="radio"
                   name="question_{{ q.question_id }}"
                   value="{{ q.option_a }}"
                   required>
            {{ q.option_a }}
        </label>

        <label class="option d-block">
            <input type="radio"
                   name="question_{{ q.question_id }}"
                   value="{{ q.option_b }}">
            {{ q.option_b }}
        </label>

        <label class="option d-block">
            <input type="radio"
                   name="question_{{ q.question_id }}"
                   value="{{ q.option_c }}">
            {{ q.option_c }}
        </label>

        <label class="option d-block">
            <input type="radio"
                   name="question_{{ q.question_id }}"
                   value="{{ q.option_d }}">
            {{ q.option_d }}
        </label>

    </div>

    {% endfor %}

    <div class="text-center">

        <button type="submit" class="submit-btn">
            <i class="bi bi-check-circle"></i>
            Submit Assessment
        </button>

    </div>

</form>
            
        </div>

    </div>

</body>
</html>
