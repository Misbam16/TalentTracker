<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Change Password - TalentTrack AI</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f5ff;
        }

        .container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px;
        }

        .card {
            width: 450px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow: 0 8px 25px rgba(0,0,0,.10);
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: auto;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: #eeeaff;

            font-size: 30px;
        }

        h2 {
            text-align: center;
            color: #4036c8;

            margin-top: 18px;
        }

        .subtitle {
            text-align: center;
            color: #777;

            font-size: 14px;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 12px;

            border: 1px solid #ddd;

            border-radius: 8px;

            margin-bottom: 18px;

            outline: none;
        }

        input:focus {
            border-color: #5146e5;
        }

        .btn {
            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 8px;

            background: #5146e5;

            color: white;

            font-weight: bold;

            cursor: pointer;
        }

        .btn:hover {
            background: #4035c4;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            text-decoration: none;

            color: #5146e5;

            font-size: 14px;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="icon">
            🔐
        </div>

        <h2>Change Password</h2>

        <p class="subtitle">
            Update your TalentTrack AI account password.
        </p>

        <form method="POST"
              action="/change-password">

            <label>
                Current Password
            </label>

            <input
                type="password"
                name="current_password"
                required
            >

            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                required
            >

            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                required
            >

            <button
                type="submit"
                class="btn">

                Update Password

            </button>

        </form>

        <a href="/settings"
           class="back">

            ← Back to Settings

        </a>

    </div>

</div>

</body>

</html>
