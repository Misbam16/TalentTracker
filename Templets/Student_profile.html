<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Profile</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background: linear-gradient(135deg,#8ab6ff,#0b4db8);
    min-height:100vh;
    padding:40px;
}

.profile-card{
    max-width:500px;
    margin:auto;

    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    color:white;
}
.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    background:#003b9b;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:55px;
    margin:auto;
}

.form-control{
    border-radius:10px;
}

.btn-save{
    background:#003b9b;
    border:none;
    padding:12px;
    font-weight:bold;
}
.back-dashboard {
    text-align: center;
    margin-top: 20px;
}

.dashboard-btn {
    display: inline-block;
    text-decoration: none;
    background: #4f46e5;
    color: white;
    padding: 12px 22px;
    border-radius: 8px;
    font-weight: 600;
    transition: 0.3s;
}

.dashboard-btn:hover {
    background: #4f46e5;
    transform: translateY(-2px);
}
</style>

</head>
<body>

<div class="container">

    
<div class="profile-card">

    
<form method="POST"action="/profile" enctype="multipart/form-data">
        <div class="text-center mb-4">

        <div class="profile-img">
            <i class="bi bi-person-fill"></i>
        </div>

        <h2 class="mt-3">Student Profile</h2>
        <p>TalentTrack AI</p>

    </div>

    <div class="row">

       <div class="col-md-12 mb-3">
    <label>Full Name</label>
    <input type="text"
           class="form-control"
           value="{{ student['full_name'] }}"
           readonly>
</div>

<div class="col-md-12 mb-3">
    <label>Email</label>
    <input type="email"
           class="form-control"
           value="{{ student['email'] }}"
           readonly>
</div>

<div class="col-md-12 mb-3">
    <label>Mobile Number</label>
    <input type="text"
           class="form-control"
           value="{{ student['mobile'] }}"
           readonly>
</div>

<div class="col-md-6 mb-3">
    <label>Date of Birth</label>
   <input type="date"
       name="dob"
       class="form-control"
       value="{{ student['dob'] if student['dob'] else '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>Gender</label>
   <select name="gender" class="form-control">

    <option value="">Select Gender</option>

    <option value="Female"
        {% if student['gender'] == 'Female' %}selected{% endif %}>
        Female
    </option>

    <option value="Male"
        {% if student['gender'] == 'Male' %}selected{% endif %}>
        Male
    </option>

    <option value="Other"
        {% if student['gender'] == 'Other' %}selected{% endif %}>
        Other
    </option>

</select>
</div>

<div class="col-md-12 mb-3">
    <label>Address</label>
    <textarea name="address"
          class="form-control"
          rows="3">{{ student.address or '' }}</textarea>
        </div>

<div class="col-md-12 mb-3">
    <label>Semester</label>
  <input type="number"
       name="semester"
       class="form-control"
       value="{{ student['semester'] if student['semester'] else '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>10th Percentage</label>
    <input type="number"
       name="tenth_percentage"
       step="0.01"
       class="form-control"
       value="{{ student['tenth_percentage'] if student['tenth_percentage'] else '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>12th Percentage</label>
    <input type="number"
       name="twelfth_percentage"
       step="0.01"
       class="form-control"
       value="{{ student['twelfth_percentage'] or '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>Graduation Percentage</label>
    <input type="number"
       name="graduation_percentage"
       step="0.01"
       class="form-control"
       value="{{ student['graduation_percentage'] or '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>Python Skill (%)</label>
    <input type="number"
       name="python_skill"
       class="form-control"
       min="0"
       max="100"
       value="{{ student['python_skill'] or '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>Java Skill (%)</label>
    <input type="number"
       name="java_skill"
       class="form-control"
       min="0"
       max="100"
       value="{{ student['java_skill'] or '' }}">
</div>

<div class="col-md-12 mb-3">
    <label>SQL Skill (%)</label>
    <input type="number"
       name="sql_skill"
       class="form-control"
       min="0"
       max="100"
       value="{{ student['sql_skill'] or '' }}">
</div>
        <div class="col-md-12 mb-3">
    <label>Upload Resume</label>

    <input type="file"
           name="resume"
           class="form-control">

    {% if student.resume_path %}
        <div class="mt-3">
            <p><strong>Uploaded Resume:</strong></p>

            <a href="/{{ student.resume_path }}"
               target="_blank"
               class="btn btn-success">
                📄 View Resume
            </a>

            <a href="/{{ student.resume_path }}"
               download
               class="btn btn-primary">
                ⬇ Download Resume
            </a>
        </div>
    {% endif %}
</div>

    </div>

    <div class="text-center mt-4">
    <button type="submit" class="btn btn-save text-white">
        Save Profile
    </button>
</div>


    </form>
    <div class="back-dashboard">
    <a href="/dashboard" class="dashboard-btn">
        ← Back to Dashboard
    </a>
</div>
</div>

</div>
</body>
</html>
