<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TalentTrack AI - Register</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

<style>

body{
    background: linear-gradient(135deg,#8ab6ff,#0b4db8);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.register-card{
    width:500px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(15px);
    border-radius:20px;
    padding:35px;
    box-shadow:0 8px 25px rgba(0,0,0,0.3);
    color:white;
}

.profile-icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#003b9b;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:auto;
    font-size:40px;
}

.form-control,
.form-select{
    border-radius:10px;
}

.btn-register{
    background:#003b9b;
    border:none;
    padding:12px;
    font-weight:bold;
    letter-spacing:1px;
}

.btn-register:hover{
    background:#002a70;
}

a{
    text-decoration:none;
}

</style>
</head>

<body>

<div class="register-card">

    <div class="text-center">

        <div class="profile-icon mb-3">
            <i class="bi bi-person-plus-fill text-white"></i>
        </div>

        <h2>TalentTrack AI</h2>
        <p>Create Your Account</p>

    </div>

    <form action="/register" method="POST">

        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-person-fill"></i>
                </span>
                <input type="text" class="form-control" name="full_name" placeholder="Enter Full Name">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Email Address</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-envelope-fill"></i>
                </span>
                <input type="email" class="form-control" name="email" placeholder="Enter Email">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Mobile Number</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-telephone-fill"></i>
                </span>
                <input type="text" class="form-control" name="mobile" placeholder="Enter Mobile Number">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Course</label>
            <select class="form-select" name="course" required>
                <option value="">Select Course</option>
                <option>MCA</option>
                <option>MSc Computer Science</option>
                <option>BCA</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-lock-fill"></i>
                </span>
                <input type="password" class="form-control" name="password" placeholder="Create Password">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text">
                    <i class="bi bi-shield-lock-fill"></i>
                </span>
                <input type="password" class="form-control" name="confirm_password" placeholder="Confirm Password">
            </div>
        </div>

        <div class="d-grid">
    <button type="submit" class="btn btn-register text-white">
        REGISTER
    </button>
</div>

        <div class="text-center mt-3">
            Already have an account?
            <a href="\login" class="text-warning fw-bold">
                Login Here
            </a>
        </div>

    </form>

</div>

</body>
</html>
